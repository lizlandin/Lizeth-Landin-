<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oasis</title>
</head>

<body style="
    margin: 0; /* Elimina los márgenes predeterminados */
    background-color: #ffffff; /* Fondo blanco */
    height: 100vh; /* Ocupa toda la altura de la pantalla */
    display: flex; /* Activa Flexbox */
    justify-content: center; /* Centra horizontalmente */
    align-items: center; /* Centra verticalmente */
">

    <!-- Contenedor exterior -->
    <div style="
        background-color: #000000; /* Fondo negro */
        padding: 10px; /* Espacio interior */
    ">

        <!-- Contenedor interior -->
        <div style="
            text-align: center; /* Centra el texto */
            border: 5px solid #ffffff; /* Borde blanco */
            background-color: #000000; /* Fondo negro */
            padding: 10px 25px; /* Espaciado vertical y horizontal */
        ">

            <!-- Estilo del texto OASIS -->
            <i style="
                margin: 0; /* Elimina márgenes */
                color: #ffffff; /* Texto blanco */
                font-family: Arial, Helvetica, sans-serif; /* Tipo de letra */
                font-size: 80px; /* Tamaño de letra */
                font-weight: 900; /* Letra muy gruesa o negrita */
                text-transform: lowercase; /* Convierte el texto a minúsculas */
                letter-spacing: 5px; /* Espacio entre letras */
            ">OASIS</i>

        </div>
    </div>

</body>
</html>
